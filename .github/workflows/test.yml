name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: build and check dist/ is up to date
        run: |
          node scripts/build.mjs
          git diff --exit-code -- dist || (echo "dist/ is out of date: run npm run build and commit it" && exit 1)
      - run: node tests/run.mjs
      - run: JAK_SRC=1 node tests/run.mjs
